{% extends "base.html" %}

{% block title %}Delete Semester{% endblock %}

{% block content %}

<h2>Delete Semester</h2>

<p>
    Are you sure you want to delete
    <strong>{{ semester.name }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Delete
    </button>

    <a href="{% url 'academics:semester_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
