<header class="topbar border-bottom bg-white px-4 py-3 d-flex justify-content-between align-items-center">
    <div>
    <span class="fw-semibold">
        {{ page_title }}
    </span>
</div>

    <div class="d-flex align-items-center gap-3">
        
        {% if user.is_authenticated %}

            <span class="text-muted">{{ user.username }}</span>
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'accounts:logout' %}">Logout</a>
        {% else %}
            <a class="btn btn-outline-primary btn-sm" href="{% url 'accounts:login' %}">Login</a>
        {% endif %}
    </div>
</header>
